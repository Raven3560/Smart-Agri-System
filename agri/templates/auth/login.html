{% extends "auth/_layout.html" %}
{% from "_macros.html" import icon, flash_messages %}
{% block title %}Log in{% endblock %}
{% block form %}
<h1>Log in</h1>
<p class="sub">Welcome back. Pick up where you left off.</p>
{{ flash_messages() }}
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">Email</label>
    <input class="input" type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      <button class="pw-toggle" type="button" data-pw-toggle="password">Show</button>
    </div>
  </div>
  <div class="auth-row">
    <label class="checkbox"><input type="checkbox" name="remember" value="1" checked> Keep me logged in</label>
  </div>
  <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
</form>
<div class="or">or</div>
<form method="post" action="{{ url_for('auth.demo') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn-ghost btn-block" type="submit">Explore with a demo account</button>
</form>
<p class="auth-switch">New to SmartAgri? <a href="{{ url_for('auth.register') }}">Create a free account</a></p>
{% endblock %}
