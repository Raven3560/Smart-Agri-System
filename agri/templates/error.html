{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container page">
  <div class="card empty" style="max-width: 560px; margin: 40px auto">
    {{ icon("alert") }}
    <h1 style="font-size: 1.4rem; color: var(--text)">{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="row" style="justify-content: center">
      <a class="btn btn-ghost" href="javascript:history.back()">Go back</a>
      <a class="btn btn-primary" href="{{ url_for('main.dashboard') if g.user else url_for('main.index') }}">Home</a>
    </div>
    <p class="small" style="margin-top: 14px">Error {{ code }}</p>
  </div>
</div>
{% endblock %}
