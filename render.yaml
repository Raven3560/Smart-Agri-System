# Render Blueprint: https://render.com/docs/blueprint-spec
# With the ONNX runtime the app needs ~120 MB of memory, so the free plan works.
# Free plans have no persistent disk: accounts and scans reset on each deploy.
# For persistence switch to plan: starter and add the disk block shown at the bottom.
services:
  - type: web
    name: smartagri
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SMARTAGRI_BACKEND
        value: onnx
    # disk:                      # paid plans only
    #   name: smartagri-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (and add env var INSTANCE_DIR=/var/data/instance)
